apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-eks-app
  namespace: devops-app
  labels:
    app: devops-eks-app
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: devops-eks-app

  template:
    metadata:
      labels:
        app: devops-eks-app

    spec:
      containers:
        - name: devops-eks-app

          image: 743610859738.dkr.ecr.ap-south-1.amazonaws.com/devops-eks-app:v2

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
